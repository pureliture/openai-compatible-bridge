# Production CI, publication and deployment are owned by GoCD.
# GitHub retains the independent pull-request offline test lane only.
name: Pull Request Tests
on:
  pull_request:
    branches: [main]
    paths:
      - 'openai_compatible_bridge/**'
      - 'vendor/context-hide/**'
      - 'scripts/**'
      - 'tests/**'
      - 'Dockerfile'
      - '.dockerignore'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/**'
  workflow_dispatch:
concurrency:
  group: pr-tests-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  test:
    name: Run Offline Pytest Suite & Snapshot Verifier
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Dependencies
        run: uv sync --frozen --no-editable
      - name: Verify Vendor Snapshot
        run: uv run python scripts/verify_vendor_context_hide.py
      - name: Run Vendor Snapshot Tests
        run: uv run pytest -v tests/test_vendor_snapshot.py
      - name: Run Engine Unit Tests
        shell: bash
        run: |
          if [ -d vendor/context-hide/tests ]; then
            uv run pytest -v vendor/context-hide/tests
          else
            echo "vendor/context-hide/tests not present; engine tested via bridge suite"
          fi
      - name: Run Bridge Offline Unit Tests
        run: |
          uv run pytest -v \
            --ignore=tests/test_remote_postgres_fixture.py \
            --ignore=tests/test_cost_schema.py \
            --ignore=tests/test_compaction_cost_integration.py \
            --ignore=tests/test_postgres_cost_repository.py \
            --ignore=tests/test_async_cost.py \
            --ignore=tests/test_cost_postgres_api.py
